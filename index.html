        <!--lista não ordenada-->

        <section>
            <h2>formulario simples</h2>

                    <br>

                    <br>

                    <br>

                    <label for="anexo">Anexo;</label>
                    <input type="file" id="anexo" required>

                <br>

            <button type="submit">enviar</button> 
            <br>
            <button type="reset">limpar</button>

                </form>


        </section>
